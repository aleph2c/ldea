---
# Always the system python: it has the apt bindings the apt module needs.
# "auto" picked a venv python when a venv was active on a local connection.
ansible_python_interpreter: /usr/bin/python3
# The account to configure: whoever ansible logged in as. Override per host
# or group in the inventory (user=pi) when the target account differs.
user: "{{ ansible_facts['user_id'] }}"
group: "{{ ansible_facts['user_id'] }}"
git_user: Scott Volk
git_email: scott@13down.io
tmuxc_repo: "git@github.com:aleph2c/tmux.conf.git"
bashrc_repo: "git@github.com:aleph2c/bashrc.git"
pdbrc_repo: "git@github.com:aleph2c/pdb.conf.git"
