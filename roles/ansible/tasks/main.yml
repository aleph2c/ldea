---
# Everything the deployment machine needs in its shell goes to
# ~/.config/bash/local.sh (machine-specific), never to the shared ~/.bashrc,
# and only when the shell does not already provide it.
- name: See what the shell already configures
  shell: cat "{{ bashrc_home }}/.bashrc" "{{ bash_local }}" 2>/dev/null || true
  register: shell_config
  changed_when: false
  tags:
    - ansible
    - shell

- name: Start an ssh agent at login, unless the shell already does
  lineinfile:
    path: "{{ bash_local }}"
    create: yes
    mode: '0644'
    line: "{{ item }}"
  loop:
    - 'eval "$(ssh-agent -s)" > /dev/null'
    - 'ssh-add > /dev/null 2>&1'
  when: "'ssh-agent' not in shell_config.stdout"
  tags:
    - ansible
    - shell

# The path is relative on purpose: every ansible repo (ldea, missionloops_ansible)
# keeps its own .vault_pass script at its root and playbooks run from there, so
# the one VAULT_PASSWORD in ~/.config/bash/secrets.sh serves every repo's vault.
- name: Point ansible at each repo's vault password script, unless already set
  lineinfile:
    path: "{{ bash_local }}"
    create: yes
    mode: '0644'
    line: 'export ANSIBLE_VAULT_PASSWORD_FILE=./.vault_pass'
  when: "'ANSIBLE_VAULT_PASSWORD_FILE=' not in shell_config.stdout"
  tags:
    - ansible
    - shell
  tags:
    - ansible

- name: Install specified requirements in indicated venv
  shell:
    cmd: "{{playbook_dir}}/venv/bin/pip install -r {{playbook_dir}}/requirements.txt"
  args:
    chdir: "{{ playbook_dir }}/venv"
    executable: /usr/bin/bash
  tags:
    - ansible

- name: Turn off ansible host key checking, unless already set
  lineinfile:
    path: "{{ bash_local }}"
    create: yes
    mode: '0644'
    line: export ANSIBLE_HOST_KEY_CHECKING=False
  when: "'ANSIBLE_HOST_KEY_CHECKING=' not in shell_config.stdout"
  tags:
    - ansible
    - shell

- name: Write the ansible configuration file
  become: true
  copy:
    src: "{{ role_path }}/files/ansible.cfg"
    dest: "{{ role_path }}/../../ansible.cfg"
    mode: '0644'
    owner: root
    group: root
  tags:
    - ansible

