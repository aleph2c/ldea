---
- name: Enable ssh-forwarding from ldea deployment machine
  lineinfile:
    path: ~/.bashrc
    line: "{{ item }}"
  loop:
    - 'eval $(ssh-agent)'
    - 'ssh-add ~/.ssh/id_rsa'

- name: Test whether .bashrc already points ansible at a vault password file
  shell:
    grep -c "^export ANSIBLE_VAULT_PASSWORD_FILE=" ~/.bashrc || true
  register: vault_file_export
  changed_when: false
  tags:
    - ansible

# Only when absent: an existing line is left exactly as it is. The path is
# relative on purpose: every ansible repo (ldea, missionloops_ansible) keeps
# its own .vault_pass script at its root, and playbooks are run from there,
# so the one VAULT_PASSWORD in .bashrc serves every repo's vault.
- name: Point ansible at the vault password script
  lineinfile:
    path: ~/.bashrc
    line: 'export ANSIBLE_VAULT_PASSWORD_FILE=./.vault_pass'
  when: vault_file_export.stdout == '0'
  tags:
    - ansible
  tags:
    - ansible

- name: Install specified requirements in indicated venv
  shell:
    cmd: "{{playbook_dir}}/venv/bin/pip install -r {{playbook_dir}}/requirements.txt"
  args:
    chdir: "{{ playbook_dir }}/venv"
    executable: /usr/bin/bash
  tags:
    - ansible

- name: Test to see if ANSIBLE_HOST_KEY_CHECKING is defined in the .bashrc file
  shell:
    grep -c "ANSIBLE_HOST_KEY_CHECKING" ~/.bashrc || true
  register: ansible_host_key_checking_bash
  tags:
    - ansible

- name: Turn off ansible hostkey checking
  lineinfile:
    path: ~/.bashrc
    line: export ANSIBLE_HOST_KEY_CHECKING=False
  when: ansible_host_key_checking_bash.stdout == '0'
  tags:
    - ansible

- name: Write the ansible configuration file
  become: true
  copy:
    src: "{{ role_path }}/files/ansible.cfg"
    dest: "{{ role_path }}/../../ansible.cfg"
    mode: '0644'
    owner: root
    group: root
  tags:
    - ansible

