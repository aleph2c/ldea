# ansible.cfg for ldea. Only the settings that differ from ansible's defaults;
# `ansible-config validate` should pass and `ansible-config dump --only-changed`
# should show exactly these. The ansible role copies this file into place on
# the deployment machine from roles/ansible/files/ansible.cfg (keep in sync).

[defaults]
# gather facts once per host per run, then reuse them from the cache
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
# targets are named in `personal` by IP on a private LAN; host keys churn
host_key_checking = False
# output: the built-in callback, results rendered as yaml, task timings
stdout_callback = ansible.builtin.default
callback_result_format = yaml
callbacks_enabled = profile_tasks
bin_ansible_callbacks = True

[connection]
# one ssh round trip per task instead of three
pipelining = True

[ssh_connection]
# forward the deployment machine's agent so targets can clone from github
ssh_args = -o ForwardAgent=yes -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null
