---
# roles/bashrc/tasks/main.yml
#
# ~/.config/bash is a clone of the shared shell configuration repo and
# ~/.bashrc is a symlink to the bashrc inside it (bash only ever reads
# ~/.bashrc). Two files the repo ignores live beside it and are created only
# when absent, never rewritten:
#   local.sh     this machine only (paths, project rc files, quirks)
#   secrets.sh   keys and passwords; mode 600; never backed up

- name: Ensure the ~/.local directory exists
  file:
    path: "{{ bashrc_home }}/.local"
    state: directory
  tags:
    - bashrc

# ansible's git task resets a checkout to origin's head and silently drops
# commits that were never pushed; refuse to run it on a checkout that is ahead.
- name: Count commits in {{ bash_cfg }} that were never pushed
  command: git -C {{ bash_cfg }} rev-list --count @{upstream}..HEAD
  register: bashrc_unpushed
  changed_when: false
  failed_when: false
  tags:
    - bashrc

- name: Refuse to discard unpushed commits in {{ bash_cfg }}
  fail:
    msg: "{{ bash_cfg }} has {{ bashrc_unpushed.stdout }} commit(s) not pushed to its remote; the update would reset them away. Push (or move) them first."
  when: bashrc_unpushed.rc == 0 and (bashrc_unpushed.stdout | int) > 0
  tags:
    - bashrc

# A machine set up before the repo existed already has ~/.config/bash with
# local.sh and secrets.sh but no .git; adopt it in place rather than fail.
- name: Adopt an existing ~/.config/bash that is not yet a clone
  shell: |
    git -C "{{ bash_cfg }}" init -q -b main
    git -C "{{ bash_cfg }}" remote add origin "{{ bashrc_repo }}"
    git -C "{{ bash_cfg }}" fetch -q origin
    git -C "{{ bash_cfg }}" checkout -q -f -B main origin/main
  args:
    creates: "{{ bash_cfg }}/.git"
    removes: "{{ bash_cfg }}"
  tags:
    - bashrc

- name: Clone or update the shared bash configuration
  git:
    repo: "{{ bashrc_repo }}"
    dest: "{{ bash_cfg }}"
    version: main
    update: yes
  tags:
    - bashrc

- name: Keep ~/.config/bash private (it holds secrets.sh)
  file:
    path: "{{ bash_cfg }}"
    state: directory
    mode: '0700'
  tags:
    - bashrc

- name: Install the pre-commit hook that refuses secrets
  copy:
    src: "{{ bash_cfg }}/pre-commit-hook.sh"
    dest: "{{ bash_cfg }}/.git/hooks/pre-commit"
    remote_src: yes
    mode: '0755'
  tags:
    - bashrc

- name: See whether ~/.bashrc is still a regular file (the distribution default)
  stat:
    path: "{{ bashrc_home }}/.bashrc"
  register: bashrc_stat
  tags:
    - bashrc

- name: Keep a copy of the original ~/.bashrc before replacing it
  copy:
    src: "{{ bashrc_home }}/.bashrc"
    dest: "{{ bashrc_home }}/.bashrc.dist"
    remote_src: yes
    force: no
  when: bashrc_stat.stat.exists and not bashrc_stat.stat.islnk
  tags:
    - bashrc

- name: Point ~/.bashrc at the shared configuration
  file:
    src: "{{ bash_cfg }}/bashrc"
    dest: "{{ bashrc_home }}/.bashrc"
    state: link
    force: yes
  tags:
    - bashrc

- name: Create local.sh if it does not exist
  copy:
    dest: "{{ bash_cfg }}/local.sh"
    force: no
    mode: '0644'
    content: |
      # This machine only: paths, project rc files, quirks. Sourced by ~/.bashrc; not in git.
  tags:
    - bashrc

# The placeholder is deliberate: a fresh machine cannot open any ansible vault
# until the user overwrites it with the real password, and the file tells them.
- name: Create secrets.sh if it does not exist
  copy:
    dest: "{{ bash_cfg }}/secrets.sh"
    force: no
    mode: '0600'
    content: |
      # Secrets only. Sourced by ~/.bashrc; mode 600; never committed, never backed up.
      # One line per secret: export NAME=value
      # VAULT_PASSWORD is the one password behind every ansible vault (missionloops_ansible
      # and any other repo with a .vault_pass script). ldea writes a placeholder here;
      # overwrite it with the real password to use those vaults from this machine.

      export VAULT_PASSWORD="replace me, the only copy of the vault password lives here"
  tags:
    - bashrc

- name: Keep secrets.sh private even if it already existed
  file:
    path: "{{ bash_cfg }}/secrets.sh"
    mode: '0600'
  tags:
    - bashrc
