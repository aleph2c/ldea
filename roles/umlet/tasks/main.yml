---
# roles/umlet/tasks/main.yml
#
# UMLet {{ umlet_version }} unpacked under ~/umlet-standalone-<version>/Umlet,
# the custom statechart palette, and the shell lines that put umlet.sh on the
# PATH. Shell lines go to ~/.config/bash/local.sh (this machine's file), never
# to the shared ~/.bashrc, and only if not already present.

- name: Accept the Microsoft core fonts licence so the install is non-interactive
  become: yes
  debconf:
    name: ttf-mscorefonts-installer
    question: msttcorefonts/accepted-mscorefonts-eula
    value: "true"
    vtype: select
  tags:
    - umlet

- name: Install what UMLet and the diagram pipeline need
  become: yes
  apt:
    name:
      - unzip
      - ttf-mscorefonts-installer
      - inotify-tools
      - graphviz
    state: present
  tags:
    - umlet

- name: Check whether UMLet {{ umlet_version }} is already unpacked
  stat:
    path: "{{ umlet_dir }}/umlet.jar"
  register: umlet_jar
  tags:
    - umlet

- name: Unpack UMLet {{ umlet_version }}
  unarchive:
    src: "{{ umlet_zip }}"
    dest: "{{ umlet_root }}"
    remote_src: yes
  when: not umlet_jar.stat.exists
  tags:
    - umlet

- name: Make umlet.sh executable
  file:
    path: "{{ umlet_dir }}/umlet.sh"
    mode: '0755'
  tags:
    - umlet

- name: Install the custom statechart palette
  get_url:
    url: "{{ umlet_palette_url }}"
    dest: "{{ umlet_dir }}/palettes/Custom UML State Machine.uxf"
    mode: '0644'
  tags:
    - umlet

- name: See what the shell already configures
  shell: cat "{{ umlet_home }}/.bashrc" "{{ bash_local }}" 2>/dev/null || true
  register: shell_config
  changed_when: false
  tags:
    - umlet
    - shell

- name: Put umlet.sh on the PATH, unless the shell already does
  lineinfile:
    path: "{{ bash_local }}"
    create: yes
    mode: '0644'
    line: 'export PATH=$PATH:{{ umlet_dir | replace(umlet_home, "$HOME") }}'
  when: "'umlet-standalone' not in shell_config.stdout"
  tags:
    - umlet
    - shell

# umlet.sh honours UMLET_JAVA_OPTS, so the Nimbus look-and-feel is set from the
# environment rather than by editing the script (the class name is the
# javax.swing one; the old com.sun.java one no longer loads).
- name: Use the Nimbus look-and-feel for UMLet, unless the shell already sets it
  lineinfile:
    path: "{{ bash_local }}"
    create: yes
    mode: '0644'
    line: "export UMLET_JAVA_OPTS='-Dswing.defaultlaf=javax.swing.plaf.nimbus.NimbusLookAndFeel'"
  when: "'UMLET_JAVA_OPTS' not in shell_config.stdout"
  tags:
    - umlet
    - shell

# umlet.sh insists on a display even for -action=convert; an empty DISPLAY
# makes it run headless.
- name: Alias umlet to run headless, unless the shell already does
  lineinfile:
    path: "{{ bash_local }}"
    create: yes
    mode: '0644'
    line: "alias umlet='DISPLAY= umlet.sh'"
  when: "'alias umlet=' not in shell_config.stdout"
  tags:
    - umlet
    - shell
