---
# roles/tmux/tasks/main.yml
- name: Install tmux
  become: yes
  apt:
    name: tmux
    state: present
  tags:
    - tmux

# ansible's git task resets the checkout to origin's head: uncommitted edits
# make it refuse, but commits that were never pushed are silently dropped.
# Refuse to run it on a checkout that is ahead of its remote.
- name: Count commits in ~/.tmux that were never pushed
  command: git -C ~/.tmux rev-list --count @{upstream}..HEAD
  register: tmux_unpushed
  changed_when: false
  failed_when: false
  tags:
    - tmux

- name: Refuse to discard unpushed commits in ~/.tmux
  fail:
    msg: "~/.tmux has {{ tmux_unpushed.stdout }} commit(s) not pushed to its remote; the update would reset them away. Push (or move) them first."
  when: tmux_unpushed.rc == 0 and (tmux_unpushed.stdout | int) > 0
  tags:
    - tmux

- name: Install custom .tmux.conf file
  git:
    repo: "{{ tmuxc_repo }}"
    dest: ~/.tmux
    clone: yes
    update: yes
  tags:
    - tmux

- name: Create a softlink to the .tmux.conf file
  file:
    src: ~/.tmux/.tmux.conf
    dest: ~/.tmux.conf
    owner: "{{ user }}"
    group: "{{ user }}"
    state: link

# The plugins listed with @plugin in .tmux.conf are vendored as submodules,
# which the clone above pulls; this covers any listed but not yet vendored.
- name: Install any tmux plugins that TPM lists but the clone did not bring
  command: ~/.tmux/plugins/tpm/bin/install_plugins
  register: tpm_install
  changed_when: "'Installing' in tpm_install.stdout"
  tags:
    - tmux

- name: Get the home path for root
  become: true
  ansible.builtin.getent:
    database: passwd
    key: root
  register: root_getent
  tags:
    - tmux

- name: Give root the same tmux configuration
  become: yes
  file:
    src: "/home/{{ user }}/.tmux/.tmux.conf"
    dest: "{{ root_getent.ansible_facts.getent_passwd['root'][4] }}/.tmux.conf"
    state: link
    force: yes
  tags:
    - tmux

