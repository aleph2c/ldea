---
# roles/nvim/tasks/main.yml
#
# neovim plus everything init.vim expects to find on the machine:
#   ripgrep + fzf      ,g ,gg ,/ ,r Ctrl-p ;   search and pickers
#   universal-ctags    Ctrl-] and the ~/.git_template hooks (git role)
#   xclip              system clipboard
#   python3-pynvim     the Python provider (UltiSnips, far.vim)
#   glow               ,g in markdown buffers

- name: Install neovim and the tools its configuration expects
  become: yes
  apt:
    name:
      - neovim
      - ripgrep
      - fzf
      - universal-ctags
      - xclip
      - python3-pynvim
    state: present
    update_cache: yes
    cache_valid_time: 3600
  tags:
    - nvim

- name: Download glow from its GitHub release
  become: yes
  get_url:
    url: "https://github.com/charmbracelet/glow/releases/download/v{{ glow_version }}/glow_{{ glow_version }}_{{ glow_arch[ansible_facts['architecture']] }}.deb"
    dest: "/tmp/glow_{{ glow_version }}.deb"
    mode: '0644'
  when: ansible_facts['architecture'] in glow_arch
  tags:
    - nvim

- name: Install glow
  become: yes
  apt:
    deb: "/tmp/glow_{{ glow_version }}.deb"
  when: ansible_facts['architecture'] in glow_arch
  tags:
    - nvim

- name: Use nvim as the system editor
  become: yes
  alternatives:
    name: editor
    path: /usr/bin/nvim
  tags:
    - nvim

- name: Use nvim as vi
  become: yes
  alternatives:
    name: vi
    path: /usr/bin/nvim
  tags:
    - nvim

# The configuration repo tracks autoload/plug.vim itself, so vim-plug needs
# no separate download.
- name: Pull down the init.vim configuration from github
  git:
    repo: "{{ neovim_init_repo }}"
    dest: "{{ neovim_config_dir }}"
    update: yes
  tags:
    - nvim

- name: Install the nvim plugins
  command: nvim --headless "+silent! PlugInstall!" +qall!
  changed_when: false
  tags:
    - nvim

# Root gets the same editor: its nvim config and plugin directories are
# symlinks into the user's, unless root already has real ones of its own.
- name: Get the home path for root
  become: true
  ansible.builtin.getent:
    database: passwd
    key: root
  register: root_getent
  tags:
    - nvim
    - root

- name: Set root home path variable
  set_fact:
    root_home: "{{ root_getent.ansible_facts.getent_passwd['root'][4] }}"
  tags:
    - nvim
    - root

- name: Root's config and data directories exist
  become: true
  ansible.builtin.file:
    path: "{{ root_home }}/{{ item }}"
    state: directory
    mode: '0700'
  loop:
    - .config
    - .local/share
  tags:
    - nvim
    - root

- name: See whether root already has nvim directories of its own
  become: true
  ansible.builtin.stat:
    path: "{{ root_home }}/{{ item }}"
  loop:
    - .config/nvim
    - .local/share/nvim
  register: root_nvim_dirs
  tags:
    - nvim
    - root

- name: Give root the same nvim configuration and plugins
  become: true
  ansible.builtin.file:
    src: "/home/{{ user }}/{{ item.item }}"
    dest: "{{ root_home }}/{{ item.item }}"
    state: link
  loop: "{{ root_nvim_dirs.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not (item.stat.exists and item.stat.isdir and not item.stat.islnk)
  tags:
    - nvim
    - root
