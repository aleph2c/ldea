---
# roles/nvim/vars/main.yml
config_dir: "/home/{{ user }}/.config"
neovim_config_dir: "{{ config_dir }}/nvim"
neovim_init_repo: "git@github.com:aleph2c/init.vim.git"

# glow (markdown preview, bound to ,g in markdown buffers) is not in the
# Debian/Ubuntu archives; it comes from the charmbracelet GitHub release.
glow_version: "2.1.2"
glow_arch:
  x86_64: amd64
  aarch64: arm64
